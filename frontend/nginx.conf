# Конфигурация nginx для production-контейнера фронтенда:
# раздача SPA + проксирование API на backend-контейнер.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # лимит загрузки файлов (NFR: до 50 МБ)
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # долгие операции (LLM-верификация) не должны обрываться прокси
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
