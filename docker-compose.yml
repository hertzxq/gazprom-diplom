version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gazprom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gazprom_procurement
      POSTGRES_USER: gazprom
      POSTGRES_PASSWORD: gazprom_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazprom -d gazprom_procurement"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: gazprom-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    # Раскомментируйте блок ниже, если есть NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama_data:
