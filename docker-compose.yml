services:
  backend:
    build: ./backend
    container_name: gazprom-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gazprom:gazprom_secret@db:5432/gazprom_procurement
      DATABASE_URL_SYNC: postgresql+psycopg2://gazprom:gazprom_secret@db:5432/gazprom_procurement
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - generated:/app/generated
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: gazprom-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: gazprom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gazprom_procurement
      POSTGRES_USER: gazprom
      POSTGRES_PASSWORD: gazprom_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazprom -d gazprom_procurement"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: gazprom-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    # Раскомментируйте блок ниже, если есть NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama_data:
  uploads:
  generated:
