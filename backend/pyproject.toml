[tool.poetry]
name = "gazprom-diplom-backend"
version = "1.0.0"
description = "Система поддержки закупочной деятельности — бэкенд"
authors = ["Admin <admin@gazprom.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = "0.30.0"}
sqlalchemy = "2.0.35"
alembic = "1.13.0"
asyncpg = "0.29.0"
psycopg2-binary = "2.9.9"
pydantic = "2.9.0"
pydantic-settings = "2.5.0"
python-multipart = "0.0.9"
openpyxl = "3.1.5"
pdfplumber = "0.11.4"
pytesseract = "0.3.13"
opencv-python-headless = "4.10.0.84"
httpx = "0.27.2"
passlib = {extras = ["bcrypt"], version = "1.7.4"}
bcrypt = "4.0.1"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
rapidfuzz = "3.9.7"
python-dotenv = "1.0.1"
xlrd = "^2.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
aiosqlite = "^0.20.0"
xlwt = "^1.3.0"      # генерация .xls для тестов file_parser
reportlab = "^4.4.0" # генерация .pdf для тестов file_parser

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring docker postgres",
    "slow: slow tests (e.g. file IO)",
    "llm: tests requiring real Ollama at OLLAMA_BASE_URL",
]

[[tool.poetry.source]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
